[workspace]
members = [
    "crates/buzz-protocol-lifter",
    "crates/app-runtime",
    "crates/buzz-cli-lifter",
    "crates/buzz-relay-lifter",
    "crates/buzz-surface-check",
    "crates/buzz-surface-profile",
    "crates/buzz-surface-projection",
    "crates/data-model-convergence",
    "crates/entity-spec",
    "crates/fleetd-control-lifter",
    "crates/fleetd-control-projection",
    "crates/fleetd-capability-pack",
    "crates/fleetd-interaction-plan",
    "crates/fleetd-surface-lowering",
    "crates/gooir-analysis",
    "crates/gooir-capability",
    "crates/gooir-core",
    "crates/gooir-datamodel-pack",
    "crates/gooir-doctor",
    "crates/lift-defeasible",
    "crates/openapi-lifter",
    "crates/openapi-lowering",
    "crates/payments-dialect",
    "crates/postgres-catalog-lifter",
    "crates/prisma-schema-lifter",
    "crates/prisma-schema-lowering",
    "crates/retry-safety-analysis",
    "crates/semantics-data-model-v1",
    "crates/sql-ddl-lowering",
    "crates/semantics-effects-v1",
    "crates/semantics-fleetd-control-v0",
    "crates/semantics-software-surface-v1",
    "crates/surface-completeness-analysis",
    "crates/workflow-dialect",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "http://localhost:3000/git/fbc8af98610e54d4385470c142ebed37a49b2facae6c9ff0902a3a118e669e40/gooir"

[workspace.dependencies]
buzz-protocol-lifter = { path = "crates/buzz-protocol-lifter" }
app-runtime = { path = "crates/app-runtime" }
buzz-cli-lifter = { path = "crates/buzz-cli-lifter" }
buzz-relay-lifter = { path = "crates/buzz-relay-lifter" }
buzz-surface-check = { path = "crates/buzz-surface-check" }
buzz-surface-profile = { path = "crates/buzz-surface-profile" }
buzz-surface-projection = { path = "crates/buzz-surface-projection" }
data-model-convergence = { path = "crates/data-model-convergence" }
entity-spec = { path = "crates/entity-spec" }
fleetd-control-lifter = { path = "crates/fleetd-control-lifter" }
fleetd-control-projection = { path = "crates/fleetd-control-projection" }
fleetd-capability-pack = { path = "crates/fleetd-capability-pack" }
fleetd-interaction-plan = { path = "crates/fleetd-interaction-plan" }
fleetd-surface-lowering = { path = "crates/fleetd-surface-lowering" }
gooir-analysis = { path = "crates/gooir-analysis" }
gooir-capability = { path = "crates/gooir-capability" }
gooir-core = { path = "crates/gooir-core" }
gooir-datamodel-pack = { path = "crates/gooir-datamodel-pack" }
gooir-doctor = { path = "crates/gooir-doctor" }
lift-defeasible = { path = "crates/lift-defeasible" }
heck = "0.5"
openapi-lifter = { path = "crates/openapi-lifter" }
openapi-lowering = { path = "crates/openapi-lowering" }
payments-dialect = { path = "crates/payments-dialect" }
postgres-catalog-lifter = { path = "crates/postgres-catalog-lifter" }
prisma-schema-lifter = { path = "crates/prisma-schema-lifter" }
prisma-schema-lowering = { path = "crates/prisma-schema-lowering" }
retry-safety-analysis = { path = "crates/retry-safety-analysis" }
semantics-data-model-v1 = { path = "crates/semantics-data-model-v1" }
sql-ddl-lowering = { path = "crates/sql-ddl-lowering" }
semantics-effects-v1 = { path = "crates/semantics-effects-v1" }
semantics-fleetd-control-v0 = { path = "crates/semantics-fleetd-control-v0" }
semantics-software-surface-v1 = { path = "crates/semantics-software-surface-v1" }
surface-completeness-analysis = { path = "crates/surface-completeness-analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
syn = { version = "3", features = ["full", "visit"] }
tempfile = "3"
toml = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
workflow-dialect = { path = "crates/workflow-dialect" }
