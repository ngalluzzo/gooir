[workspace]
members = [
    "crates/gooir-capability",
    "crates/gooir-cli",
    "crates/gooir-doctor",
    "crates/gooir-derive",
    "crates/gooir-identity",
    "crates/gooir-module-planning",
    "crates/gooir-module-v0",
    "crates/gooir-package",
    "crates/gooir-planning",
    "crates/gooir-plugin-process",
    "crates/gooir-provider",
    "crates/gooir-wasip1-command-runtime",
    "crates/lift-defeasible",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gooir-capability = { path = "crates/gooir-capability" }
gooir-cli = { path = "crates/gooir-cli" }
gooir-doctor = { path = "crates/gooir-doctor" }
gooir-derive = { path = "crates/gooir-derive" }
gooir-identity = { path = "crates/gooir-identity" }
gooir-module-planning = { path = "crates/gooir-module-planning" }
gooir-module-v0 = { path = "crates/gooir-module-v0" }
gooir-package = { path = "crates/gooir-package" }
gooir-planning = { path = "crates/gooir-planning" }
gooir-plugin-process = { path = "crates/gooir-plugin-process" }
gooir-provider = { path = "crates/gooir-provider" }
gooir-wasip1-command-runtime = { path = "crates/gooir-wasip1-command-runtime" }
lift-defeasible = { path = "crates/lift-defeasible" }

nix = { version = "=0.31.3", features = ["fs"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
tempfile = "3"
wasmparser = "=0.254.0"
wasmtime = { version = "=48.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p1"] }
wat = "1"
